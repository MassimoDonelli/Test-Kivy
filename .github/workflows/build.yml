name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Forziamo Python 3.11 sulla macchina virtuale
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Configurazione automatica di Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installazione delle dipendenze di sistema (senza errori di battitura)
      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip patch texinfo libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake automake
          pip3 install --upgrade pip
          pip3 install --user --upgrade Cython virtualenv buildozer

      # Compilazione diretta senza comandi di "clean" errati e senza nascondere i log
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Accetta le licenze e avvia direttamente la build pulita
          yes | buildozer android debug

      # Caricamento del file APK finale
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
