name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze di sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache automake libltdl-dev libffi-dev libssl-dev autoconf autotools-dev libtool pkg-config zlib1g-dev python3-pip
          pip3 install --upgrade pip
          pip3 install buildozer cython kivy

      - name: Gestione Cache (Ottimizza i build successivi)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilazione APK con Buildozer
        run: |
          yes | buildozer android debug

      - name: Caricamento dell'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
