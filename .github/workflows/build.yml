name: Build Android APK (Soluzione Definitiva)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python di sistema
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configura Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa le dipendenze di sistema necessarie
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache automake libltdl-dev libffi-dev libssl-dev autoconf autotools-dev libtool pkg-config zlib1g-dev python3-pip openjdk-17-jdk libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext zip unzip

      - name: Installa Buildozer e Cython
        run: |
          pip3 install --upgrade pip
          pip3 install "buildozer>=1.5.0" "cython<3.0.0" kivy

      - name: Disattiva il blocco di sicurezza di Root e allinea Python
        run: |
          # Forza la disattivazione del prompt [y/n] di root modificando direttamente il file .spec
          sed -i 's/^#\? \?warn_on_root =.*/warn_on_root = 0/' buildozer.spec
          
          # Ripulisce i requisiti per evitare il crash del mismatch tra python3 e hostpython3
          sed -i 's/^requirements =.*/requirements = python3, kivy/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a/' buildozer.spec

      - name: Compilazione APK con Buildozer
        env:
          # Rimuove l'NDK di sistema di GitHub per non corrompere la compilazione
          ANDROID_NDK: ""
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_LATEST_HOME: ""
        run: |
          # Avvia Buildozer in modalità non interattiva
          buildozer android debug --report
          
      - name: Caricamento dell'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
