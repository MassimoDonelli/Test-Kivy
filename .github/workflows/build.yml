name: CI
on:
push:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-20.04

steps:
uses: actions/checkout@v2

name: Get Date:set-output name=date::$(/bin/date -u "+%Y%m%d")"
run: |
shell: bash

shell: bash

id: get-date concurrency:


name: Directory globale della cache di Buildozer
uses: actions/cache@v2
with:
path: .buildozer_global
key: buildozer-global-${{ hashFiles('buildozer.spec') }} # Sostituisci con il tuo percorso

uses: actions/cache@v2
with:
path: .buildozer
key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

name: Compila con Buildozer
uses: ArtemSBulgakov/buildozer-action@v1
id: buildozer
with:
command: buildozer android debug
buildozer_version: stable

Nome: Carica artefatti
Usa: actions/upload-artifact@v2
Con:
Nome: pacchetto
Percorso: ${{ steps.buildozer.outputs.filename }}
