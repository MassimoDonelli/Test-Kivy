name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04 # Manteniamo la 22.04 per massima stabilità di build con Android NDK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ottiene la data per invalidare la cache giornalmente
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Directory globale della cache di Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache locale Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

      
      - name: Compila con Buildozer
        uses: geof90/buildozer-action@v2
        id: buildozer
        with:
            command: buildozer android debug
            repository_root: .
