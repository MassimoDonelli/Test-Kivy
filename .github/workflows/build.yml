name: Build Android APK (Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Compilazione APK dentro Container Docker Ufficiale
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/buildozer/src \
            kivy/buildozer:latest \
            android debug

      - name: Caricamento dell'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
