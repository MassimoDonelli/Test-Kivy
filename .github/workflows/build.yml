name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configura Python 3.11 (versione perfetta per Buildozer/Kivy)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Configura Java 17 (obbligatorio per Gradle e Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Installa le dipendenze di sistema Linux
      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip patch texinfo libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake automake
          pip3 install --upgrade pip
          pip3 install --user --upgrade Cython virtualenv buildozer

      # 4. COMPILAZIONE DEFINITIVA: Forziamo una build totalmente pulita
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # La variabile P4A_clean_builds=1 costringe il compilatore a spazzare via 
          # qualsiasi residuo corrotto prima di iniziare, salvandoci dai crash nascosti.
          export P4A_clean_builds=1
          yes | buildozer android debug

      # 5. Salva l'APK generato
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
