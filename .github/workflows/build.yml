name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # IMPORTANTE: Forziamo Python 3.11 sulla macchina virtuale per accoppiarlo a Buildozer
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installazione di Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installazione dipendenze Ubuntu
      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip patch texinfo libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake automake
          pip3 install --upgrade pip
          pip3 install --user --upgrade Cython virtualenv buildozer

      # Gestione della Cache
      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

      # 4. Compilazione ottimizzata per evitare il troncamento dei log su GitHub
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Eseguiamo in modalità standard (mostra solo avvisi e scarti importanti)
          # ma reindirizziamo un log completo in un file in caso di crash
          yes | buildozer android debug > buildozer_output.log 2>&1 || (tail -n 100 buildozer_output.log && exit 1)
            # Salvataggio APK
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
