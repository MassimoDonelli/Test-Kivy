name: Build Android APK (Docker Final Fix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Fix permessi per la cartella di lavoro
        run: |
          chmod -R 777 ${{ github.workspace }}

      - name: Compilazione APK dentro Container Docker Ufficiale
        run: |
          # Usiamo --entrypoint per saltare lo script interno difettoso
          # e inseriamo la variabile d'ambiente che disattiva il controllo di root di Buildozer
          docker run --rm \
            --entrypoint "" \
            -v ${{ github.workspace }}:/home/buildozer/src \
            -e BUILDOZER_ALLOW_KIVY_CONTAINER_ROOT=1 \
            kivy/buildozer:latest \
            buildozer android debug

      - name: Caricamento dell'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk
